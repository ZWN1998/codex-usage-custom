name: Windows x64 release

on:
  push:
    branches: [windows-v0.1.6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-v0.1.6-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'ZWN1998/codex-usage-custom'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Parse Windows scripts
        shell: powershell
        run: |
          foreach ($path in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "Parse failed: $path" }
          }
      - name: Core checks
        shell: pwsh
        run: dotnet run --project tests/CodexUsage.Core.Tests -c Release
      - name: Windows native text and placement checks
        shell: pwsh
        run: dotnet run --project tests/CodexUsage.Desktop.Tests -c Release -r win-x64 -p:RuntimeIdentifiers=win-x64
      - name: Build Windows self-contained package
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Verify package contents and SHA-256
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - name: Publish separate Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.6-windows'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Windows release already exists; refusing to overwrite published assets.' }
          gh release create $tag `
            artifacts/CodexUsage-Custom-0.1.6-windows-x64.zip `
            artifacts/CodexUsage-Custom-0.1.6-windows-x64.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title 'Codex Usage Custom 0.1.6 — Windows x64' `
            --notes-file WINDOWS-RELEASE-NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows release upload failed.' }
